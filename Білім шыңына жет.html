<style>
/* Layout: one full-screen meadow scene (3:2) with seven stones climbing to the bone; a question card opens over it. Single bright daytime look, committed on purpose. */
:root {
  --sky: #8fd6ff;
  --sky-low: #d6f3ff;
  --grass: #7bcf55;
  --grass-deep: #4ea93d;
  --wood: #b9783a;
  --wood-deep: #7a4a22;
  --ink: #1d2f6f;
  --cream: #fff8e7;
  --gold: #ffc83d;
  --ok: #2faa57;
  --bad: #e04b4b;
  --o1: #3a7bd5;
  --o2: #f08a24;
  --o3: #2a9d6a;
  --o4: #8e5bd1;
  --font: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(to bottom, var(--sky) 0, var(--sky-low) 44%, var(--grass) 45%, var(--grass-deep) 100%);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.app { height: 100%; display: grid; place-items: center; position: relative; }
#scene { width: 100%; height: 100%; display: block; max-height: 100%; user-select: none; -webkit-user-select: none; }
#scene text { font-family: var(--font); font-weight: 900; }

.stone { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.stone-body { transition: transform .18s ease; }
.stone:hover .stone-body, .stone:focus-visible .stone-body { transform: translateY(-8px); }
.stone:focus-visible .stone-top { stroke: var(--ink); stroke-width: 7; }
.stone-num { fill: #6b4a1f; stroke: #fff6dc; stroke-width: 6; paint-order: stroke; pointer-events: none; }
.badge { opacity: 0; transition: opacity .3s; pointer-events: none; }
.stone.done { cursor: default; }
.stone.done .stone-top { fill: #c6ecb3; stroke: #7fbf68; }
.stone.done .stone-side { fill: #98cf84; }
.stone.done .stone-num { fill: #2b7a3a; }
.stone.done .badge { opacity: 1; }
.stone.done:hover .stone-body { transform: none; }

.cloud-in { animation: drift 40s ease-in-out infinite alternate; }
.cloud-in.slow { animation-duration: 58s; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
.rays { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.glow { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .8; } }
.bone-bob { transform-box: fill-box; transform-origin: center; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.bone-won .bone-bob { animation: won .5s ease-in-out infinite alternate; }
@keyframes won { from { transform: scale(1) rotate(-8deg); } to { transform: scale(1.3) rotate(8deg); } }
.sun-in { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }

.tools {
  position: absolute; left: 0; bottom: 8px;
  display: flex; gap: 8px; align-items: center; z-index: 5;
}
.pill {
  background: var(--cream); color: var(--ink); border: 3px solid var(--wood-deep);
  border-radius: 999px; font: 800 15px/1 var(--font); padding: 10px 14px; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box;
}
button.pill { cursor: pointer; }
button.pill:hover { background: #fff0c6; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
.pill svg { width: 22px; height: 22px; }

.overlay {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center;
  background: rgba(22, 40, 100, .55);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.card {
  width: min(960px, 100%); box-sizing: border-box;
  background: var(--cream); border: 10px solid var(--wood); border-radius: 36px;
  box-shadow: 0 0 0 5px var(--wood-deep), 0 24px 60px rgba(0,0,0,.35);
  padding: clamp(18px, 3vw, 34px); position: relative;
  animation: pop .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.card.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
.q-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.q-num {
  width: clamp(54px, 7vw, 76px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff1b3, var(--gold) 60%, #f0a500);
  border: 5px solid var(--wood-deep); display: grid; place-items: center;
  font-weight: 900; font-size: clamp(28px, 4vw, 42px); color: var(--ink); flex: none;
}
.q-src { font-weight: 800; font-size: clamp(14px, 1.8vw, 18px); background: #e3efff; color: var(--ink); border-radius: 999px; padding: 8px 14px; min-width: 0; }
.q-text { margin: 0 0 clamp(16px, 2.4vw, 26px); font-weight: 900; font-size: clamp(22px, 3.3vw, 40px); line-height: 1.2; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.6vw, 18px); }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left; min-width: 0;
  font: 800 clamp(18px, 2.4vw, 28px)/1.15 var(--font); color: #fff;
  border: 0; border-radius: 22px; padding: clamp(12px, 1.8vw, 20px); min-height: clamp(66px, 9vw, 96px);
  cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.22); transition: transform .12s, box-shadow .12s, filter .12s;
}
.opt:nth-child(1) { background: var(--o1); }
.opt:nth-child(2) { background: var(--o2); }
.opt:nth-child(3) { background: var(--o3); }
.opt:nth-child(4) { background: var(--o4); }
.opt:hover:not(:disabled) { transform: translateY(-3px); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
.opt .ltr { flex: none; width: 2.1em; height: 2.1em; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: .9em; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt.ok { background: var(--ok) !important; animation: jump .5s; }
.opt.bad { background: var(--bad) !important; opacity: .8; }
.opt:disabled:not(.ok):not(.bad) { filter: grayscale(.6) opacity(.55); cursor: default; }
.opt:disabled { cursor: default; }
@keyframes jump { 40% { transform: scale(1.05); } }
.q-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: clamp(14px, 2vw, 24px); min-height: 64px; flex-wrap: wrap; }
.fb { font-weight: 900; font-size: clamp(20px, 2.8vw, 32px); margin: 0; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.next {
  margin-left: auto; font: 900 clamp(20px, 2.8vw, 30px)/1 var(--font); color: var(--ink);
  background: linear-gradient(#ffe27a, var(--gold)); border: 5px solid var(--wood-deep);
  border-radius: 999px; padding: 14px 32px; cursor: pointer; box-shadow: 0 6px 0 var(--wood-deep);
}
.next:hover { filter: brightness(1.06); }
.next:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--wood-deep); }

#fw { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
.finale {
  position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px)); z-index: 16;
  display: flex; justify-content: center; padding: 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.finale .box {
  pointer-events: auto; text-align: center; background: var(--cream);
  border: 8px solid var(--wood); box-shadow: 0 0 0 4px var(--wood-deep), 0 18px 40px rgba(0,0,0,.3);
  border-radius: 32px; padding: clamp(14px, 2.4vw, 26px) clamp(20px, 4vw, 48px);
  animation: pop .5s cubic-bezier(.2,1.3,.4,1);
}
.finale h2 { margin: 0; font-size: clamp(30px, 5.4vw, 64px); font-weight: 900; color: #e8590c; line-height: 1.05; text-wrap: balance; }
.finale p { margin: 6px 0 14px; font-weight: 800; font-size: clamp(18px, 2.6vw, 30px); }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .cloud-in, .rays, .glow, .bone-bob, .sun-in { animation: none; }
  .card, .finale .box { animation: none; }
}
</style>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  }
  function $(id) { return document.getElementById(id); }

  /* ---------- Questions (from the pasted texts) ---------- */
  var Q = [
    { src: 'Бала Абай', q: 'Биыл Абайдың жасы нешеге толған еді?', o: ['11', '12', '13', '14'], a: 2 },
    { src: 'Бала Абай', q: 'Абай өзге балалардан гөрі кімді дос тұтты?', o: ['Атасын', 'Қарабасты', 'Ағасын', 'Әжесін'], a: 3 },
    { src: 'Ақсүйек', q: 'Балалар ақсүйекті қай жерге дейін жүгіріп апаруды келісті?', o: ['Мектепке дейін', 'Алтыбақанға дейін', 'Өзенге дейін', 'Үйге дейін'], a: 1 },
    { src: '«Отамалы» деген – не?', q: '«Сәуір» – бұл неліктен алынған арабша ат?', o: ['Айдың аты', 'Құстың аты', 'Таудың аты', 'Қойшының аты'], a: 0 },
    { src: '«Отамалы» деген – не?', q: 'Отамалы деп аталған кім болған?', o: ['Абайдың досы', 'Құнанбайдың атқосшысы', 'Бір байдың қойшысы', 'Ауыл молдасы'], a: 2 },
    { src: 'Күзгі құс керуені', q: 'Ең биік ұшатын құстар қайсысы?', o: ['Торғайлар мен қарғалар', 'Үйректер мен қаздар', 'Көкектер мен бүркіттер', 'Тырналар мен аққулар'], a: 3 },
    { src: 'Күзгі құс керуені', q: 'Құстар тізбегінің ең алдында кім ұшады?', o: ['Жолбасшы', 'Ең кішкентай құс', 'Ең әлсіз құс', 'Соңғы құс'], a: 0 }
  ];
  var LET = ['А', 'Б', 'В', 'Г'];

  var STONES = [
    { x: 460, y: 830, rx: 118, ry: 62 }, { x: 585, y: 745, rx: 112, ry: 58 },
    { x: 740, y: 665, rx: 108, ry: 56 }, { x: 880, y: 555, rx: 112, ry: 58 },
    { x: 1060, y: 480, rx: 110, ry: 56 }, { x: 1215, y: 390, rx: 106, ry: 54 },
    { x: 1370, y: 300, rx: 100, ry: 50 }
  ];
  var START = { x: 190, y: 775, k: 1.25 };

  /* ---------- Static scene decoration ---------- */
  (function deco() {
    var i, g;
    g = $('sunRays');
    for (i = 0; i < 16; i++) {
      mk('path', { d: 'M-14 -74 L0 -128 L14 -74 Z', fill: '#ffd23f', transform: 'rotate(' + (i * 22.5) + ')' }, g);
    }
    g = $('boneRays');
    for (i = 0; i < 12; i++) {
      mk('path', { d: 'M-9 -70 L0 -150 L9 -70 Z', fill: '#fff3a0', opacity: '.75', transform: 'rotate(' + (i * 30) + ')' }, g);
    }
    g = $('yurtOrn');
    for (i = 0; i < 12; i++) {
      mk('path', { d: 'M' + (458 + i * 19.5) + ' 392 l8 8 l8 -8 z' }, g);
    }
    var d1 = $('deco');
    [[780, 830], [330, 800], [640, 960], [100, 990], [1180, 720], [860, 700], [1290, 560], [1010, 640]].forEach(function (p) {
      for (var j = -1; j <= 1; j++) mk('path', { d: 'M' + (p[0] + j * 9) + ' ' + p[1] + ' l' + (j * 6) + ' -22 l7 22 z', fill: '#3f9d3a' }, d1);
    });
    [[1480, 740, 64], [1415, 520, 50], [270, 985, 42], [640, 610, 44], [1130, 560, 40]].forEach(function (r) {
      mk('ellipse', { cx: r[0], cy: r[1], rx: r[2], ry: r[2] * .7, fill: '#9aa0ad' }, d1);
      mk('ellipse', { cx: r[0] - r[2] * .2, cy: r[1] - r[2] * .2, rx: r[2] * .6, ry: r[2] * .36, fill: '#b9bfcb' }, d1);
    });
    var d2 = $('deco2');
    function flower(x, y, c, s, parent) {
      var f = mk('g', { transform: 'translate(' + x + ' ' + y + ') scale(' + s + ')' }, parent);
      mk('path', { d: 'M0 0 V46', stroke: '#2f8a3a', 'stroke-width': 5, fill: 'none' }, f);
      mk('path', { d: 'M0 30 q-18 -6 -22 -20 q18 0 22 20z', fill: '#3f9d3a' }, f);
      for (var k = 0; k < 5; k++) {
        var a = k * 72 * Math.PI / 180;
        mk('circle', { cx: Math.sin(a) * 15, cy: -Math.cos(a) * 15, r: 11, fill: c }, f);
      }
      mk('circle', { r: 8, fill: '#ffd23a' }, f);
    }
    [[1180, 905, '#ff5a36', 1.3], [1310, 850, '#ffb12b', 1], [1470, 815, '#ff4b3a', 1.4], [1120, 945, '#b86ee0', 1],
     [800, 905, '#ffdc3a', 1], [900, 865, '#ff5a36', 1.1], [660, 890, '#ffffff', .9], [330, 965, '#ffffff', .9],
     [95, 955, '#ffd23a', 1], [50, 885, '#ffffff', .9], [1400, 650, '#ffffff', .8], [1350, 575, '#ffffff', .8],
     [1180, 600, '#ff9d2e', .9], [985, 620, '#ffffff', .8], [820, 785, '#ffffff', .9], [560, 905, '#ffffff', .8], [345, 790, '#ffffff', .9]
    ].forEach(function (f) { flower(f[0], f[1] - 30, f[2], f[3], d2); });
  })();

  /* ---------- Stones ---------- */
  var stonesLayer = $('stones');
  var stoneEls = [];
  STONES.forEach(function (s, i) {
    var g = mk('g', { 'class': 'stone', tabindex: 0, role: 'button', 'aria-label': (i + 1) + '-сұрақ' }, stonesLayer);
    mk('ellipse', { cx: s.x + 8, cy: s.y + 20, rx: s.rx, ry: s.ry, fill: 'rgba(60,40,10,.3)' }, g);
    var body = mk('g', { 'class': 'stone-body' }, g);
    mk('ellipse', { 'class': 'stone-side', cx: s.x, cy: s.y + 12, rx: s.rx, ry: s.ry, fill: '#cfae78' }, body);
    mk('ellipse', { 'class': 'stone-top', cx: s.x, cy: s.y, rx: s.rx, ry: s.ry, fill: '#f0d9ae', stroke: '#c9a56b', 'stroke-width': 4 }, body);
    var t = mk('text', { 'class': 'stone-num', x: s.x, y: s.y + s.ry * 0.58, 'text-anchor': 'middle', 'font-size': Math.round(s.ry * 1.7) }, body);
    t.textContent = String(i + 1);
    var b = mk('g', { 'class': 'badge' }, body);
    mk('circle', { cx: s.x + s.rx * .66, cy: s.y - s.ry * .5, r: 24, fill: '#2faa57', stroke: '#fff', 'stroke-width': 5 }, b);
    mk('path', { d: 'M' + (s.x + s.rx * .66 - 11) + ' ' + (s.y - s.ry * .5) + ' l8 9 l15 -17', fill: 'none', stroke: '#fff', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, b);
    mk('ellipse', { cx: s.x, cy: s.y - 24, rx: s.rx + 14, ry: s.ry + 36, fill: 'transparent' }, g);
    g.addEventListener('click', function () { pick(i + 1); });
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i + 1); } });
    stoneEls.push(g);
  });

  /* ---------- State ---------- */
  var state = { done: {}, count: 0, cur: 0, busy: false, muted: false, finished: false };
  function pos(n) {
    if (n === 0) return { x: START.x, y: START.y, k: START.k };
    var s = STONES[n - 1];
    return { x: s.x, y: s.y - s.ry * 0.5, k: 1 - 0.0667 * (n - 1) };
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ---------- Sound (Web Audio, no files) ---------- */
  var ac = null;
  function actx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function tone(f, t0, d, type, g, slide) {
    var a = actx(); if (!a || state.muted) return;
    var o = a.createOscillator(), v = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(g || .2, t + .02);
    v.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(v); v.connect(a.destination);
    o.start(t); o.stop(t + d + .05);
  }
  function noise(t0, d, g, freq) {
    var a = actx(); if (!a || state.muted) return;
    var n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(), t = a.currentTime + t0;
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq || 900;
    v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(v); v.connect(a.destination); s.start(t);
  }
  var sfx = {
    hop: function () { tone(320, 0, .16, 'sine', .14, 760); },
    open: function () { tone(520, 0, .1, 'triangle', .12); tone(780, .09, .16, 'triangle', .12); },
    ok: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .1, .3, 'triangle', .22); }); tone(1319, .4, .5, 'sine', .14); },
    bad: function () { tone(230, 0, .25, 'sawtooth', .15, 150); tone(165, .22, .45, 'sawtooth', .15, 90); },
    boom: function (g) { noise(0, .55, g || .25, 700); tone(150, 0, .4, 'sine', (g || .25) * 1.1, 40); tone(1600 + Math.random() * 1200, .05, .25, 'triangle', .05); },
    fan: function () {
      [[523, 0], [523, .16], [523, .32], [698, .5], [659, .8], [784, 1.0]].forEach(function (n) { tone(n[0], n[1], .32, 'square', .09); tone(n[0] / 2, n[1], .32, 'triangle', .12); });
      [523, 659, 784, 1047].forEach(function (f) { tone(f, 1.25, 1.1, 'triangle', .13); });
    }
  };
  $('snd').addEventListener('click', function () {
    state.muted = !state.muted;
    $('sndOn').hidden = state.muted; $('sndOff').hidden = !state.muted;
    if (!state.muted) { actx(); sfx.open(); }
  });
  $('sndOn').removeAttribute('hidden');

  /* ---------- Boy ---------- */
  var boy = $('boy'), face = 1, boyNow = { x: START.x, y: START.y, k: START.k };
  function rot(id, a, px, py) { $(id).setAttribute('transform', 'rotate(' + a.toFixed(1) + ' ' + px + ' ' + py + ')'); }
  function drawBoy(p, pose) {
    pose = pose || {};
    boy.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') scale(' + (face * p.k).toFixed(3) + ' ' + p.k.toFixed(3) + ')');
    var s = Math.sin(pose.phase || 0);
    if (pose.victory) {
      rot('armL', 158, -45, -140); rot('armR', -158, 45, -140);
      rot('legL', 12, -15, -80); rot('legR', -12, 15, -80);
    } else {
      rot('legL', 30 * s, -15, -80); rot('legR', -30 * s, 15, -80);
      rot('armL', 8 - 38 * s, -45, -140); rot('armR', -8 + 38 * s, 45, -140);
    }
  }
  function hopTo(to, dur) {
    dur = dur || 900;
    return new Promise(function (res) {
      var from = { x: boyNow.x, y: boyNow.y, k: boyNow.k };
      if (to.x < from.x - 4) face = -1; else if (to.x > from.x + 4) face = 1;
      var hops = Math.max(1, Math.round(Math.hypot(to.x - from.x, to.y - from.y) / 170));
      var t0 = performance.now();
      sfx.hop();
      var lastHop = 0;
      function step(now) {
        var t = Math.min(1, (now - t0) / dur);
        var e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        var h = Math.floor(e * hops);
        if (h !== lastHop && t < 1) { lastHop = h; sfx.hop(); }
        var x = from.x + (to.x - from.x) * e, yb = from.y + (to.y - from.y) * e, k = from.k + (to.k - from.k) * e;
        var bounce = Math.abs(Math.sin(e * Math.PI * hops)) * 72 * k;
        drawBoy({ x: x, y: yb - bounce, k: k }, { phase: e * hops * Math.PI * 2 });
        boyNow = { x: x, y: yb, k: k };
        if (t < 1) requestAnimationFrame(step);
        else { boyNow = { x: to.x, y: to.y, k: to.k }; drawBoy(boyNow); res(); }
      }
      requestAnimationFrame(step);
    });
  }
  function celebrate() {
    return new Promise(function (res) {
      var t0 = performance.now(), dur = 2400, base = { x: boyNow.x, y: boyNow.y, k: boyNow.k };
      function step(now) {
        var t = Math.min(1, (now - t0) / dur);
        var j = Math.abs(Math.sin(t * Math.PI * 4)) * 95 * base.k;
        drawBoy({ x: base.x, y: base.y - j, k: base.k }, { victory: true });
        if (t < 1) requestAnimationFrame(step); else { drawBoy(base, { victory: true }); res(); }
      }
      requestAnimationFrame(step);
    });
  }
  drawBoy(boyNow);

  /* ---------- Question dialog ---------- */
  var dlg = $('dlg'), card = $('card'), optsEl = $('opts'), fb = $('fb'), nextBtn = $('next');
  function openQ(n) {
    var q = Q[n - 1];
    state.cur = n;
    $('qn').textContent = String(n);
    $('qs').textContent = 'Мәтін: ' + q.src;
    $('qt').textContent = q.q;
    fb.textContent = ''; fb.className = 'fb';
    nextBtn.hidden = true;
    optsEl.innerHTML = '';
    q.o.forEach(function (txt, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      b.innerHTML = '<span class="ltr"></span><span class="tx"></span>';
      b.firstChild.textContent = LET[i];
      b.lastChild.textContent = txt;
      b.addEventListener('click', function () { answer(b, i); });
      optsEl.appendChild(b);
    });
    card.classList.remove('shake');
    dlg.hidden = false;
    sfx.open();
    var first = optsEl.querySelector('.opt'); if (first) first.focus({ preventScroll: true });
  }
  function answer(btn, i) {
    if (btn.disabled) return;
    var q = Q[state.cur - 1];
    if (i === q.a) {
      btn.classList.add('ok');
      Array.prototype.forEach.call(optsEl.children, function (o) { o.disabled = true; });
      fb.textContent = 'Дұрыс! Жарайсың!'; fb.className = 'fb ok';
      sfx.ok();
      if (!state.done[state.cur]) { state.done[state.cur] = true; state.count++; }
      nextBtn.hidden = false; nextBtn.focus();
    } else {
      btn.classList.add('bad'); btn.disabled = true;
      fb.textContent = 'Қате. Тағы байқап көр!'; fb.className = 'fb bad';
      sfx.bad();
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }
  function refresh() {
    stoneEls.forEach(function (g, i) { g.classList.toggle('done', !!state.done[i + 1]); });
    $('prog').textContent = state.count + ' / 7';
  }
  nextBtn.addEventListener('click', function () {
    dlg.hidden = true;
    refresh();
    state.busy = false;
    if (state.count === 7) finale();
  });

  function pick(n) {
    actx();
    if (state.busy || state.finished || state.done[n]) return;
    state.busy = true;
    hopTo(pos(n)).then(function () { openQ(n); });
  }

  /* ---------- Finale: fireworks ---------- */
  var cv = $('fw'), cx = cv.getContext('2d'), parts = [], fwTimer = null, raf = 0;
  function sizeCv() {
    var d = window.devicePixelRatio || 1;
    cv.width = Math.floor(innerWidth * d); cv.height = Math.floor(innerHeight * d);
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  function burst(x, y) {
    var hue = Math.random() * 360, n = 70 + Math.floor(Math.random() * 40);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 6.5;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: .008 + Math.random() * .012, c: 'hsl(' + ((hue + Math.random() * 50) % 360) + ',100%,' + (55 + Math.random() * 20) + '%)', r: 2 + Math.random() * 2.5 });
    }
    sfx.boom(.14);
  }
  function loop() {
    cx.globalCompositeOperation = 'destination-out';
    cx.fillStyle = 'rgba(0,0,0,.2)';
    cx.fillRect(0, 0, innerWidth, innerHeight);
    cx.globalCompositeOperation = 'lighter';
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += .06; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.life -= p.dec;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      cx.globalAlpha = Math.max(0, p.life);
      cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
    raf = requestAnimationFrame(loop);
  }
  function startFireworks() {
    cv.hidden = false; sizeCv();
    if (!raf) raf = requestAnimationFrame(loop);
    var k = 0;
    function launch() {
      burst(innerWidth * (.12 + Math.random() * .76), innerHeight * (.12 + Math.random() * .42));
      if (k++ < 3 && Math.random() > .4) setTimeout(function () { burst(innerWidth * (.12 + Math.random() * .76), innerHeight * (.12 + Math.random() * .42)); }, 180);
    }
    launch(); setTimeout(launch, 250); setTimeout(launch, 500);
    fwTimer = setInterval(launch, 650);
  }
  function stopFireworks() {
    clearInterval(fwTimer); fwTimer = null;
    cancelAnimationFrame(raf); raf = 0; parts = [];
    cx.clearRect(0, 0, innerWidth, innerHeight);
    cv.hidden = true;
  }
  addEventListener('resize', function () { if (!cv.hidden) sizeCv(); });

  async function finale() {
    state.busy = true; state.finished = true;
    await sleep(350);
    var last = pos(7);
    if (Math.abs(boyNow.x - last.x) > 3 || Math.abs(boyNow.y - last.y) > 3) await hopTo(last, 1100);
    $('boneWrap').classList.add('bone-won');
    sfx.fan();
    startFireworks();
    $('fin').hidden = false;
    await celebrate();
  }

  /* ---------- Restart ---------- */
  function reset() {
    stopFireworks();
    $('fin').hidden = true; dlg.hidden = true;
    $('boneWrap').classList.remove('bone-won');
    state.done = {}; state.count = 0; state.cur = 0; state.busy = false; state.finished = false;
    face = 1; boyNow = { x: START.x, y: START.y, k: START.k }; drawBoy(boyNow);
    refresh();
  }
  var rstTimer = null;
  $('rst').addEventListener('click', function () {
    var b = $('rst');
    if (rstTimer) { clearTimeout(rstTimer); rstTimer = null; b.textContent = 'Қайта бастау'; reset(); return; }
    b.textContent = 'Растау?';
    rstTimer = setTimeout(function () { rstTimer = null; b.textContent = 'Қайта бастау'; }, 3000);
  });
  $('again').addEventListener('click', reset);
  refresh();
})();
</script>

</body></html>
